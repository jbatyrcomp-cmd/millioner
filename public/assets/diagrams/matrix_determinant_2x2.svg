<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="100%" height="100%">
  <defs>
    <linearGradient id="detBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
  </defs>
  <rect width="440" height="250" rx="12" fill="url(#detBg)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="220" y="28" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CHIZIQLI ALGEBRA: 2x2 DETERMINANT</text>

  <!-- Determinant Vertical Bars -->
  <line x1="140" y1="65" x2="140" y2="185" stroke="#ffffff" stroke-width="3"/>
  <line x1="300" y1="65" x2="300" y2="185" stroke="#ffffff" stroke-width="3"/>

  <!-- Matrix Elements -->
  <text x="180" y="105" fill="#ffffff" font-family="Cinzel, serif" font-size="32" font-weight="700" text-anchor="middle">a</text>
  <text x="260" y="105" fill="#ffffff" font-family="Cinzel, serif" font-size="32" font-weight="700" text-anchor="middle">b</text>
  <text x="180" y="165" fill="#ffffff" font-family="Cinzel, serif" font-size="32" font-weight="700" text-anchor="middle">c</text>
  <text x="260" y="165" fill="#ffffff" font-family="Cinzel, serif" font-size="32" font-weight="700" text-anchor="middle">d</text>

  <!-- Main Diagonal Line (Green) -->
  <line x1="170" y1="90" x2="270" y2="175" stroke="#22c55e" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="290" y="195" fill="#22c55e" font-family="Montserrat, sans-serif" font-size="11" font-weight="700">(+) a · d</text>

  <!-- Anti Diagonal Line (Red) -->
  <line x1="270" y1="90" x2="170" y2="175" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="150" y="195" fill="#ef4444" font-family="Montserrat, sans-serif" font-size="11" font-weight="700">(-) b · c</text>

  <text x="220" y="230" fill="#00d4ff" font-family="Montserrat, sans-serif" font-size="14" font-weight="600" text-anchor="middle">det(A) = ?</text>
</svg>

