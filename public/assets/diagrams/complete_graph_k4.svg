<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="100%">
  <defs>
    <linearGradient id="k4Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
  </defs>
  <rect width="440" height="260" rx="12" fill="url(#k4Bg)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="220" y="26" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">DISKRET TUZILMALAR: GRAF NAZARIYASI</text>

  <!-- Edges of K4 (Outer square + 2 diagonals = 6 edges) -->
  <line x1="220" y1="50" x2="310" y2="135" stroke="#00d4ff" stroke-width="2.5"/>
  <line x1="310" y1="135" x2="220" y2="215" stroke="#00d4ff" stroke-width="2.5"/>
  <line x1="220" y1="215" x2="130" y2="135" stroke="#00d4ff" stroke-width="2.5"/>
  <line x1="130" y1="135" x2="220" y2="50" stroke="#00d4ff" stroke-width="2.5"/>
  <!-- Diagonals -->
  <line x1="220" y1="50" x2="220" y2="215" stroke="#ffd700" stroke-width="2.5"/>
  <line x1="130" y1="135" x2="310" y2="135" stroke="#ffd700" stroke-width="2.5"/>

  <!-- Vertices -->
  <circle cx="220" cy="50" r="14" fill="#0f2b5c" stroke="#ffffff" stroke-width="2"/>
  <text x="220" y="55" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" text-anchor="middle">v1</text>

  <circle cx="310" cy="135" r="14" fill="#0f2b5c" stroke="#ffffff" stroke-width="2"/>
  <text x="310" y="140" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" text-anchor="middle">v2</text>

  <circle cx="220" cy="215" r="14" fill="#0f2b5c" stroke="#ffffff" stroke-width="2"/>
  <text x="220" y="220" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" text-anchor="middle">v3</text>

  <circle cx="130" cy="135" r="14" fill="#0f2b5c" stroke="#ffffff" stroke-width="2"/>
  <text x="130" y="140" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" text-anchor="middle">v4</text>

  <!-- Side info text -->
  <text x="360" y="80" fill="#94a3b8" font-family="Montserrat, sans-serif" font-size="11">Cho'qqilar soni: n = 4</text>
  <text x="360" y="100" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="11" font-weight="700">Qirralar soni: ?</text>
</svg>

