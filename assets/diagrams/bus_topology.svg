<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="100%">
  <defs>
    <linearGradient id="busBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
  </defs>
  <rect width="440" height="260" rx="12" fill="url(#busBg)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="220" y="24" fill="#94a3b8" font-family="Montserrat, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">MAGISTRAL KABEL TOPOLOGIYASI</text>

  <!-- Central Backbone Cable -->
  <line x1="50" y1="130" x2="390" y2="130" stroke="#00d4ff" stroke-width="6"/>

  <!-- Terminators -->
  <rect x="40" y="115" width="10" height="30" fill="#ef4444" rx="2"/>
  <text x="45" y="158" fill="#ef4444" font-family="monospace" font-size="8" text-anchor="middle">Terminator</text>

  <rect x="390" y="115" width="10" height="30" fill="#ef4444" rx="2"/>
  <text x="395" y="158" fill="#ef4444" font-family="monospace" font-size="8" text-anchor="middle">Terminator</text>

  <!-- Drop Lines and Computers Top -->
  <line x1="120" y1="130" x2="120" y2="80" stroke="#ffd700" stroke-width="2"/>
  <rect x="90" y="45" width="60" height="35" rx="5" fill="#131e3d" stroke="#ffd700" stroke-width="1.5"/>
  <text x="120" y="67" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tugun A</text>

  <line x1="280" y1="130" x2="280" y2="80" stroke="#ffd700" stroke-width="2"/>
  <rect x="250" y="45" width="60" height="35" rx="5" fill="#131e3d" stroke="#ffd700" stroke-width="1.5"/>
  <text x="280" y="67" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tugun B</text>

  <!-- Drop Lines and Computers Bottom -->
  <line x1="200" y1="130" x2="200" y2="180" stroke="#ffd700" stroke-width="2"/>
  <rect x="170" y="180" width="60" height="35" rx="5" fill="#131e3d" stroke="#ffd700" stroke-width="1.5"/>
  <text x="200" y="202" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tugun C</text>

  <line x1="340" y1="130" x2="340" y2="180" stroke="#ffd700" stroke-width="2"/>
  <rect x="310" y="180" width="60" height="35" rx="5" fill="#131e3d" stroke="#ffd700" stroke-width="1.5"/>
  <text x="340" y="202" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tugun D</text>
  
  <text x="220" y="245" fill="#00d4ff" font-family="monospace" font-size="11" text-anchor="middle">Yagona umumiy magistral aloqa shinalari</text>
</svg>

