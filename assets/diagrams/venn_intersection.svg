<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="100%" height="100%">
  <defs>
    <linearGradient id="vennBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
  </defs>
  <rect width="440" height="250" rx="12" fill="url(#vennBg)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="220" y="28" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">EYLER-VENN DIAGRAMMASI</text>

  <!-- Circle A -->
  <circle cx="180" cy="125" r="75" fill="none" stroke="#ffd700" stroke-width="3"/>
  <text x="130" y="130" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="22" font-weight="800" text-anchor="middle">A</text>

  <!-- Circle B -->
  <circle cx="260" cy="125" r="75" fill="none" stroke="#a855f7" stroke-width="3"/>
  <text x="310" y="130" fill="#a855f7" font-family="Montserrat, sans-serif" font-size="22" font-weight="800" text-anchor="middle">B</text>

  <!-- Intersection shaded area (Clip path intersection) -->
  <g>
    <clipPath id="circleA">
      <circle cx="180" cy="125" r="75"/>
    </clipPath>
    <circle cx="260" cy="125" r="75" fill="#00d4ff" fill-opacity="0.5" clip-path="url(#circleA)"/>
  </g>

  <!-- Indicator Arrow -->
  <line x1="220" y1="180" x2="220" y2="135" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="198" fill="#00d4ff" font-family="Montserrat, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Bo'yalgan oraliq soha: ?</text>

  <text x="220" y="232" fill="#94a3b8" font-family="Montserrat, sans-serif" font-size="12" text-anchor="middle">Ikkala to'plamga ham bir vaqtda tegishli elementlar</text>
</svg>

