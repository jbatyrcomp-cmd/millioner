<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="100%" height="100%">
  <defs>
    <linearGradient id="transBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
  </defs>
  <rect width="440" height="260" rx="12" fill="url(#transBg)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="220" y="28" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">RADIOELEKTRONIK ASBOB SXEMASI</text>

  <!-- Outer Circle -->
  <circle cx="220" y="130" r="55" fill="#0f2b5c" stroke="#00d4ff" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Base Bar -->
  <line x1="190" y1="95" x2="190" y2="165" stroke="#ffffff" stroke-width="6"/>

  <!-- Base Terminal (B) -->
  <line x1="110" y1="130" x2="190" y2="130" stroke="#00d4ff" stroke-width="3"/>
  <text x="90" y="136" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" text-anchor="middle">B</text>
  <text x="90" y="155" fill="#94a3b8" font-family="Montserrat, sans-serif" font-size="10" text-anchor="middle">(Baza)</text>

  <!-- Collector Line (C) -->
  <line x1="190" y1="110" x2="250" y2="70" stroke="#ffffff" stroke-width="3"/>
  <line x1="250" y1="70" x2="310" y2="70" stroke="#00d4ff" stroke-width="3"/>
  <text x="330" y="76" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" text-anchor="middle">C</text>
  <text x="330" y="95" fill="#94a3b8" font-family="Montserrat, sans-serif" font-size="10" text-anchor="middle">(Kollektor)</text>

  <!-- Emitter Line (E) with Outward Arrow -->
  <line x1="190" y1="150" x2="250" y2="190" stroke="#ffffff" stroke-width="3"/>
  <!-- Outward arrow on Emitter -->
  <polygon points="245,178 256,194 235,192" fill="#22c55e"/>
  
  <line x1="250" y1="190" x2="310" y2="190" stroke="#00d4ff" stroke-width="3"/>
  <text x="330" y="196" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="18" font-weight="700" text-anchor="middle">E</text>
  <text x="330" y="215" fill="#94a3b8" font-family="Montserrat, sans-serif" font-size="10" text-anchor="middle">(Emitter)</text>

  <text x="220" y="245" fill="#22c55e" font-family="Montserrat, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Diqqat: Emitterdagi strelka TASHQARIGA yo'naltirilgan</text>
</svg>

