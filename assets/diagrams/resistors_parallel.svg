<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="100%" height="100%">
  <defs>
    <linearGradient id="parBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
  </defs>
  <rect width="440" height="250" rx="12" fill="url(#parBg)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="220" y="28" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ELEKTRONIKA: REZISTORLARNING ULANIШI</text>

  <!-- Left Main Terminal -->
  <line x1="60" y1="125" x2="140" y2="125" stroke="#00d4ff" stroke-width="3"/>
  <circle cx="60" cy="125" r="5" fill="#ffd700"/>
  <text x="45" y="130" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="14" font-weight="700">A</text>

  <!-- Left Split Node -->
  <circle cx="140" cy="125" r="4" fill="#ffffff"/>
  <line x1="140" y1="75" x2="140" y2="175" stroke="#00d4ff" stroke-width="3"/>

  <!-- Upper Branch (R1) -->
  <line x1="140" y1="75" x2="180" y2="75" stroke="#00d4ff" stroke-width="3"/>
  <rect x="180" y="60" width="80" height="30" fill="#131e3d" stroke="#ffd700" stroke-width="2"/>
  <text x="220" y="80" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" text-anchor="middle">R1</text>
  <line x1="260" y1="75" x2="300" y2="75" stroke="#00d4ff" stroke-width="3"/>

  <!-- Lower Branch (R2) -->
  <line x1="140" y1="175" x2="180" y2="175" stroke="#00d4ff" stroke-width="3"/>
  <rect x="180" y="160" width="80" height="30" fill="#131e3d" stroke="#ffd700" stroke-width="2"/>
  <text x="220" y="180" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="14" font-weight="700" text-anchor="middle">R2</text>
  <line x1="260" y1="175" x2="300" y2="175" stroke="#00d4ff" stroke-width="3"/>

  <!-- Right Split Node -->
  <line x1="300" y1="75" x2="300" y2="175" stroke="#00d4ff" stroke-width="3"/>
  <circle cx="300" cy="125" r="4" fill="#ffffff"/>

  <!-- Right Main Terminal -->
  <line x1="300" y1="125" x2="380" y2="125" stroke="#00d4ff" stroke-width="3"/>
  <circle cx="380" cy="125" r="5" fill="#ffd700"/>
  <text x="395" y="130" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="14" font-weight="700">B</text>

  <text x="220" y="228" fill="#94a3b8" font-family="Montserrat, sans-serif" font-size="12" text-anchor="middle">Formula: 1 / R_umum = 1 / R1 + 1 / R2</text>
</svg>

