<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="100%" height="100%">
  <defs>
    <linearGradient id="joinBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#040817"/>
    </linearGradient>
  </defs>
  <rect width="440" height="250" rx="12" fill="url(#joinBg)" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="220" y="28" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">MA'LUMOTLAR BAZASI: SQL JOIN OPERATSIYASI</text>

  <!-- Table A Circle -->
  <circle cx="170" cy="120" r="70" fill="#131e3d" stroke="#00d4ff" stroke-width="2.5"/>
  <text x="125" y="125" fill="#00d4ff" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Jadval A</text>

  <!-- Table B Circle -->
  <circle cx="270" cy="120" r="70" fill="#131e3d" stroke="#ffd700" stroke-width="2.5"/>
  <text x="315" y="125" fill="#ffd700" font-family="Montserrat, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Jadval B</text>

  <!-- Shaded Intersection (Matching records in both) -->
  <g>
    <clipPath id="tabA">
      <circle cx="170" cy="120" r="70"/>
    </clipPath>
    <circle cx="270" cy="120" r="70" fill="#22c55e" fill-opacity="0.6" clip-path="url(#tabA)"/>
  </g>

  <!-- Center Label -->
  <text x="220" y="125" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Mos Juftlar</text>

  <text x="220" y="220" fill="#ffffff" font-family="Montserrat, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Faqat ikkala jadvalda ham mavjud mos keluvchi qatorlar chiqadi</text>
</svg>

